<h1 mat-dialog-title class="pl-16 pt-16 pr-16">Add User</h1>

<div mat-dialog-content class="pl-16 pr-16">

  <div>
    <mat-form-field class="mr-16" appearance="outline">
      <mat-label>First Name</mat-label>
      <input [(ngModel)]="user.firstName" matInput placeholder="Your first name">
      <!-- <mat-hint>Please enter your first name</mat-hint> -->
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Last Name</mat-label>
      <input [(ngModel)]="user.lastName" matInput placeholder="Your last name">
      <!-- <mat-hint>Please enter your last name</mat-hint> -->
    </mat-form-field>
  </div>

  <div>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Birth Date</mat-label>
      <input [(ngModel)]="birthDate" matInput placeholder="" [matDatepicker]="picker">
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
      <!-- <mat-hint>Please enter your birth date</mat-hint> -->
    </mat-form-field>
  </div>

  <div>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Street + No.</mat-label>
      <input [(ngModel)]="user.street" matInput placeholder="Streetname with number">
      <!-- <mat-hint>Please enter your first name</mat-hint> -->
    </mat-form-field>
  </div>
  <div>
    <mat-form-field class="mr-16" appearance="outline">
      <mat-label>Zip code</mat-label>
      <input [(ngModel)]="user.zipCode" matInput placeholder="Zip code">
      <!-- <mat-hint>Please enter your first name</mat-hint> -->
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>City</mat-label>
      <input [(ngModel)]="user.city" matInput placeholder="City">
      <!-- <mat-hint>Please enter your first name</mat-hint> -->
    </mat-form-field>
  </div>


</div>
<div mat-dialog-actions class="pl-16 pb-16 pr-16">
  <button mat-button>Cancel</button>
  <button mat-button (click)="saveUser()" cdkFocusInitial>
    Save
  </button>
</div>
